[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/ifchecker"
  to = "/ifchecker/"
  status = 301

[[redirects]]
  from = "/lightspeed"
  to = "https://telos.net/lightspeed/"
  status = 301
  force = true

[[redirects]]
  from = "/lightspeed/*"
  to = "https://telos.net/lightspeed/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/networks"
  to = "/.netlify/functions/networks"
  status = 200
  force = true

[[redirects]]
  from = "/api/readiness/:network"
  to = "/.netlify/functions/readiness?network=:network"
  status = 200
  force = true

[[redirects]]
  from = "/api/validation-refresh"
  to = "/.netlify/functions/validation-refresh"
  status = 200
  force = true
